activity: deploy
number: "05"

entry_requirements:
  automated:
    - check: file_exists
      path: dashboards/<slug>/docs/helix/04-build/prompt-catalog.md
      description: "Prompt catalog exists to deploy from"
  manual:
    - "Build exit gate passed"

exit_requirements:
  automated:
    - check: file_exists
      path: dashboards/<slug>/docs/helix/05-deploy/deployment-guide.md
      description: "Deployment guide must exist"

    - check: grep_present
      pattern: "T-[0-9]+"
      path: dashboards/<slug>/docs/helix/05-deploy/deployment-guide.md
      description: "Verification section records per-check outcomes against the live dashboard"

    - check: grep_present
      pattern: "(PASS|FAIL|BLOCKED)"
      path: dashboards/<slug>/docs/helix/05-deploy/deployment-guide.md
      description: "Each verification check has a recorded outcome, not a promise"

  manual:
    - "Dashboard created from the themed seed matching design-decisions.md's selected theme (workflows/resources/themes/seed.<id>.lvdash.json); theme matches workflows/resources/themes/<id>.json — spot-check canvas/widget colors, font, and series palette"
    - "If Frame's Source Documents table lists a Lakeview dashboard export, the theme was applied to a side-by-side copy (not the live file) with the original theme block recorded as the rollback; every invariance baseline was re-run and matches its pre-restyle result exactly — any difference blocks this gate; T-8xx conformance checks were walked against the rendered dashboard; and permissions, sharing, run-as principal, schedules, and alerts were confirmed on the copy"
    - "Dashboard created in the workspace; every widget loads on the assigned warehouse"
    - "Every T-### check executed against the LIVE dashboard; generated SQL inspected where the check requires it"
    - "Failures triaged: re-prompted, moved to fallback views, or accepted with a recorded waiver"
    - "Permissions and sharing configured; refresh schedule set if required"
    - "Stakeholder confirmed the deployed dashboard matches the approved mockup"

next_activity: iterate
