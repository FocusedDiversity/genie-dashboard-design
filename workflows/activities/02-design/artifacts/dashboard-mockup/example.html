<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synaptiq Healthcare Analytics — Design Mockup</title>
<style>
  /* Palette derived from workflows/resources/dashboard-theme.json */
  :root{
    --bg:#EBEBEB; --card:#FCFCFD; --ink:#08141A; --muted:#4A6270;
    --line:#D5DBDF; --accent:#15AFDD; --accent2:#2375A8; --warn:#C89930;
    --sel:#D3456B;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1E343F; --card:#08141A; --ink:#EBEBEB; --muted:#8FA6B2;
           --line:#16333F; --accent:#15AFDD; --accent2:#2375A8; --warn:#C89930;
           --sel:#D3456B; }
  }
  *{box-sizing:border-box; margin:0}
  body{font:14px/1.45 "Space Grotesk",system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:2rem}
  .mockup-banner{background:var(--warn); color:#fff; text-align:center; padding:.35rem;
    font-weight:600; letter-spacing:.04em; font-size:.8rem}
  header{padding:1rem 1.25rem .25rem}
  header h1{font-size:1.15rem}
  nav.pages{display:flex; gap:.4rem; padding:.6rem 1.25rem}
  nav.pages button{border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:.45rem .9rem; border-radius:.5rem; cursor:pointer; font-weight:600}
  nav.pages button.active{background:var(--sel); border-color:var(--sel); color:#fff}
  .filter-bar{display:flex; flex-wrap:wrap; gap:.75rem; padding:.5rem 1.25rem .9rem; color:var(--muted)}
  .filter-bar label{display:flex; align-items:center; gap:.35rem; font-size:.8rem}
  .filter-bar select{padding:.25rem .4rem; border-radius:.4rem; border:1px solid var(--line);
    background:var(--card); color:var(--ink)}
  .page{display:none; padding:0 1.25rem}
  .page.active{display:block}
  .kpi-row,.chart-row{display:grid; gap:.9rem; margin-bottom:.9rem}
  .kpi-row{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .chart-row{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .widget{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.9rem}
  .widget h3{font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:.4rem}
  .kpi .value{font-size:1.7rem; font-weight:700}
  .kpi .sub{font-size:.75rem; color:var(--muted)}
  figure svg{width:100%; height:170px; display:block}
  table{width:100%; border-collapse:collapse; font-size:.82rem}
  th,td{text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600}
  footer{padding:1rem 1.25rem; color:var(--muted); font-size:.75rem}
  .lg{stroke:var(--line)} .tx{fill:var(--muted); font-size:9px}
</style>
</head>
<body>
<div class="mockup-banner">DESIGN MOCKUP — all values illustrative</div>
<header><h1>Synaptiq Healthcare Analytics</h1></header>

<nav class="pages">
  <button data-page="p1" class="active">Members</button>
  <button data-page="p2">Claims &amp; Charges</button>
</nav>

<div class="filter-bar">
  <label>Date Range: <select disabled><option>Last 12 months</option></select></label>
  <label>Payer Type: <select disabled><option>All</option></select></label>
  <label>State: <select disabled><option>All</option></select></label>
</div>

<section id="p1" class="page active">
  <div class="kpi-row">
    <div class="widget kpi" data-widget-id="W-101">
      <h3>Total Members</h3><p class="value">2.14M</p><p class="sub">lifetime, unfiltered by date</p>
    </div>
    <div class="widget kpi" data-widget-id="W-102">
      <h3>Active Members</h3><p class="value">1.82M</p><p class="sub">85% of total</p>
    </div>
  </div>
  <div class="chart-row">
    <figure class="widget" data-widget-id="W-103">
      <h3>Enrollment by Payer Type</h3>
      <svg viewBox="0 0 300 170">
        <circle cx="85" cy="85" r="52" fill="none" stroke="var(--accent)" stroke-width="26"
          stroke-dasharray="163 327" transform="rotate(-90 85 85)"/>
        <circle cx="85" cy="85" r="52" fill="none" stroke="var(--accent2)" stroke-width="26"
          stroke-dasharray="114 327" stroke-dashoffset="-163" transform="rotate(-90 85 85)"/>
        <circle cx="85" cy="85" r="52" fill="none" stroke="var(--warn)" stroke-width="26"
          stroke-dasharray="50 327" stroke-dashoffset="-277" transform="rotate(-90 85 85)"/>
        <text x="170" y="60" class="tx">■ Commercial 50%</text>
        <text x="170" y="80" class="tx">■ Medicaid 35%</text>
        <text x="170" y="100" class="tx">■ Medicare 15%</text>
      </svg>
    </figure>
    <figure class="widget" data-widget-id="W-104">
      <h3>Members by Age Band</h3>
      <svg viewBox="0 0 300 170">
        <line x1="30" y1="140" x2="290" y2="140" class="lg"/>
        <rect x="45"  y="95" width="34" height="45" fill="var(--accent)"/>
        <rect x="95"  y="55" width="34" height="85" fill="var(--accent)"/>
        <rect x="145" y="40" width="34" height="100" fill="var(--accent)"/>
        <rect x="195" y="65" width="34" height="75" fill="var(--accent)"/>
        <rect x="245" y="105" width="34" height="35" fill="var(--accent)"/>
        <text x="48" y="155" class="tx">0-17</text><text x="95" y="155" class="tx">18-34</text>
        <text x="145" y="155" class="tx">35-49</text><text x="195" y="155" class="tx">50-64</text>
        <text x="252" y="155" class="tx">65+</text>
      </svg>
    </figure>
  </div>
</section>

<section id="p2" class="page">
  <div class="kpi-row">
    <div class="widget kpi" data-widget-id="W-201">
      <h3>Total Billed</h3><p class="value">$412M</p><p class="sub">max charge per claim, summed</p>
    </div>
    <div class="widget kpi" data-widget-id="W-202">
      <h3>Denial Rate</h3><p class="value">6.8%</p><p class="sub">target &lt; 8%</p>
    </div>
  </div>
  <div class="chart-row">
    <figure class="widget" data-widget-id="W-203" style="grid-column:1/-1">
      <h3>Monthly Billed vs Paid</h3>
      <svg viewBox="0 0 620 170">
        <line x1="30" y1="140" x2="600" y2="140" class="lg"/>
        <polyline fill="none" stroke="var(--accent)" stroke-width="2.5"
          points="40,70 120,62 200,75 280,58 360,52 440,60 520,45 595,50"/>
        <polyline fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-dasharray="5 4"
          points="40,95 120,90 200,101 280,86 360,82 440,90 520,74 595,80"/>
        <text x="40" y="155" class="tx">Aug</text><text x="200" y="155" class="tx">Nov</text>
        <text x="360" y="155" class="tx">Feb</text><text x="520" y="155" class="tx">May</text>
        <text x="470" y="30" class="tx">— Billed &nbsp; ┄ Paid</text>
      </svg>
    </figure>
  </div>
</section>

<footer>Mockup</footer>

<script>
  document.querySelectorAll("nav.pages button").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll("nav.pages button").forEach(function(b){b.classList.remove("active")});
      document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active")});
      btn.classList.add("active");
      document.getElementById(btn.dataset.page).classList.add("active");
    });
  });
</script>
</body>
</html>
