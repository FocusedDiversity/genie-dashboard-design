activity: design
number: "02"

entry_requirements:
  automated:
    - check: file_exists
      path: docs/helix/01-frame/widget-inventory.md
      description: "Frame produced a widget inventory to design against"
  manual:
    - "Frame exit gate passed; stakeholder approved the plan"
    - "If existing documents were provided by User in stage 01-frame, design related docs (mockups, etc.) should be copied to the design stage artifact directory and used to inform All aspects of design (along with the normal widget inventory, etc.)"

exit_requirements:
  automated:
    - check: file_exists
      path: docs/helix/02-design/dashboard-mockup.html
      description: "Browser-viewable HTML mockup must exist"

    - check: file_exists
      path: docs/helix/02-design/design-decisions.md
      description: "Design decisions record must exist"

    - check: grep_present
      pattern: "data-widget-id=\"W-[0-9]+\""
      path: docs/helix/02-design/dashboard-mockup.html
      description: "Every mockup widget is tagged with its inventory W-### id"

    - check: grep_absent
      pattern: "<link[^>]+href=\"https?://|@import|fonts\\.googleapis"
      path: docs/helix/02-design/dashboard-mockup.html
      description: "No external stylesheets or fonts; Chart.js CDN script is the only permitted external reference"

    - check: grep_present
      pattern: "wanderbricks|clinical-slate|executive-minimal"
      path: docs/helix/02-design/design-decisions.md
      description: "A catalog theme id is recorded under Theme Selection"

  manual:
    - "If User provided documents in Frame Stage, they should be used to inform All aspects of design. if there is uncertainty, the design is based on the widget inventory and stakeholder clarification from questiions to the user"
    - "If Frame's Source Documents table lists an existing mockup, wireframe, or style/brand doc, Theme Selection in design-decisions.md documents how it was reconciled with the catalog choice (match, override, or gap) — not silently ignored"
    - "Mockup's canvas/widget/font/accent colors and chart series match the exact hex values of the theme recorded in design-decisions.md (workflows/resources/themes/<id>.json)"
    - "Mockup opened in a browser by the stakeholder; every page reviewed"
    - "Every inventory widget appears in the mockup; no mockup widget is missing from the inventory"
    - "Chart types match metric shape (time series -> line, comparison -> bar, part-of-whole -> donut)"
    - "Aggregation rules recorded per widget; double-counting prevention stated, not implied"
    - "Filter flow documented: which filters reach which widgets, and which widgets are exempt"
    - "Accessibility reviewed: series distinguishable without color, direction glyphs paired with text"
    - "Stakeholder approved the design (Gate: 'Proceed to Test')"

next_activity: test
